<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Recomendaciones - Series</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6c5ce7">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header class="main-header">
        <h1>🎬 Mis Recomendaciones de Series</h1>
        <p>Compartí tus contenidos favoritos con la comunidad</p>
    </header>

    <main class="container">

        <!-- Panel de Autenticación (TP6) -->
        <section class="auth-card">
            <div id="auth-logged-out" class="auth-box">
                <h3>Acceso de Usuarios</h3>
                <div class="auth-form-group">
                    <input type="email" id="auth-email" placeholder="Correo electrónico" required>
                    <input type="password" id="auth-password" placeholder="Contraseña" required>
                </div>
                <div class="auth-buttons">
                    <button id="btn-login" class="btn-auth btn-login-style">Iniciar Sesión</button>
                    <button id="btn-register" class="btn-auth btn-register-style">Registrarse</button>
                </div>
            </div>

            <div id="auth-logged-in" class="auth-box hidden">
                <p class="user-status">🟢 Sesión iniciada como: <strong id="user-email-display"></strong></p>
                <button id="btn-logout" class="btn-action btn-delete">Cerrar Sesión</button>
            </div>
        </section>

        <!-- Formulario de Alta (Protegido por login) -->
        <section class="form-card">
            <h2 id="form-titulo">Recomendar una Serie</h2>
            
            <form id="form-serie">
                <input type="hidden" id="serie-id" value="">

                <div class="form-group">
                    <label for="titulo">Título de la serie:</label>
                    <input type="text" id="titulo" name="titulo" placeholder="Ej: Stranger Things" required>
                </div>

                <div class="form-group">
                    <label for="genero">Género:</label>
                    <select id="genero" name="genero" required>
                        <option value="" disabled selected>Seleccioná un género</option>
                        <option value="Ciencia Ficción">Ciencia Ficción</option>
                        <option value="Drama">Drama</option>
                        <option value="Comedia">Comedia</option>
                        <option value="Acción">Acción</option>
                        <option value="Terror">Terror</option>
                        <option value="Anime">Anime</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="puntuacion">Puntuación (1 al 5):</label>
                    <input type="number" id="puntuacion" name="puntuacion" min="1" max="5" step="0.5" placeholder="5" required>
                </div>

                <div class="form-group">
                    <label for="imagen_file">Imagen de Portada (Subir archivo):</label>
                    <input type="file" id="imagen_file" name="imagen_file" accept="image/*">
                </div>

                <div class="form-group">
                    <label for="imagen_url">O ingresá la URL de la portada:</label>
                    <input type="url" id="imagen_url" name="imagen_url" placeholder="https://...">
                </div>

                <div class="form-group">
                    <label for="resena">¿Por qué la recomendás?:</label>
                    <textarea id="resena" name="resena" rows="4" placeholder="Escribí una breve reseña..." required></textarea>
                </div>

                <button type="submit" id="btn-submit" class="btn-primary">Publicar Recomendación</button>
            </form>
        </section>

        <!-- Catálogo de Series -->
        <section class="catalogo-section">
            <h2>Catálogo de Recomendaciones</h2>
            <div id="grid-series" class="grid-series"></div>
        </section>
    </main>

<footer>
        <p>&copy; 2026 Proyecto App de Recomendaciones</p>
    </footer>

    <!-- 1. Cargar la librería de Supabase desde el CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 2. Cargar el script principal como Módulo ES6 -->
    <script type="module" src="main.js"></script>
</body>
</html>
